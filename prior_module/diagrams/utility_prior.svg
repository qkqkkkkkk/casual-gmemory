<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#176b43"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111; }
      .body { font: 19px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #18231d; }
      .small { font: 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #36443b; }
      .module { fill: #d7f2b9; stroke: #08753e; stroke-width: 2; }
      .box { fill: #f8fbf6; stroke: #2a7b52; stroke-width: 2; }
      .label { fill: #eaf6df; stroke: #79ad55; stroke-width: 1.5; }
      .line { stroke: #176b43; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #67c82a; stroke-width: 4; stroke-dasharray: 16 12; fill: white; }
    </style>
  </defs>
  <rect x="38" y="35" width="1204" height="650" rx="2" class="dash"/>
  <text x="70" y="82" class="title">UtilityPrior：团队边际效用 u0</text>
  <text x="70" y="116" class="small">目标：u0 = E[R_team(with M) - R_team(control)]</text>

  <rect x="76" y="270" width="265" height="122" rx="22" class="module"/>
  <text x="208" y="316" text-anchor="middle" class="title" style="font-size:25px">UtilityPrior</text>
  <text x="208" y="350" text-anchor="middle" class="small">paired team rollout</text>
  <text x="208" y="374" text-anchor="middle" class="small">negative / neutral / positive</text>

  <rect x="380" y="145" width="325" height="175" rx="14" class="box"/>
  <text x="402" y="180" class="title" style="font-size:22px">Branch M：show memory</text>
  <text x="402" y="216" class="body">复制 task / team / state</text>
  <text x="402" y="246" class="body">目标 Agent 看到 M</text>
  <text x="402" y="276" class="body">team action -> env.step</text>
  <text x="402" y="306" class="small">R_team(with M)</text>

  <rect x="380" y="385" width="325" height="175" rx="14" class="box"/>
  <text x="402" y="420" class="title" style="font-size:22px">Branch C：control</text>
  <text x="402" y="456" class="body">相同 task / team / state</text>
  <text x="402" y="486" class="body">移除 M / 匹配安慰剂</text>
  <text x="402" y="516" class="body">team action -> env.step</text>
  <text x="402" y="546" class="small">R_team(control)</text>

  <rect x="770" y="250" width="230" height="180" rx="14" class="label"/>
  <text x="885" y="290" text-anchor="middle" class="title" style="font-size:23px">Reward Delta</text>
  <text x="792" y="333" class="body">delta = R_with</text>
  <text x="792" y="365" class="body">       - R_control</text>
  <text x="792" y="405" class="small">超过阈值后分类</text>

  <rect x="1050" y="235" width="145" height="210" rx="14" class="module"/>
  <text x="1123" y="278" text-anchor="middle" class="title" style="font-size:22px">u0</text>
  <text x="1067" y="324" class="body">negative</text>
  <text x="1067" y="359" class="body">neutral</text>
  <text x="1067" y="394" class="body">positive</text>
  <text x="1067" y="430" class="small">probabilities</text>

  <path d="M341 331 L380 230" class="line"/>
  <path d="M341 331 L380 473" class="line"/>
  <path d="M705 230 L770 325" class="line"/>
  <path d="M705 473 L770 365" class="line"/>
  <path d="M1000 340 L1050 340" class="line"/>

  <rect x="77" y="590" width="1120" height="52" rx="10" class="label"/>
  <text x="98" y="623" class="small">u0 不是 r0 × d0；r0、d0 是 u 模型的输入特征，团队 delta reward 才是 u 的监督标签。</text>
</svg>
